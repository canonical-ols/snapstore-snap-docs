name: Documentation review (central configuration)

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: SecondSkoll/generic-agentic-workflows/.github/workflows/opencode-documentation-review.yml@e6a8833dc242fddf7f94fb7bbaf5c744aa409837
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration_source: central
      configuration_ref: e6a8833dc242fddf7f94fb7bbaf5c744aa409837
      configuration_profile: documentation-review
      focus: documentation
      max_comments: 10
      validate_only: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}